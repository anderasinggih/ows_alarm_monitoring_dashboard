<div class="custom-dashboard-wrapper">
  <!-- HEADER TITLE -->
  <div class="custom-header-container">
    <div>
      <h1 class="custom-title">ALARM MONITORING DASHBOARD</h1>
      <p class="custom-subtitle">Real-time Network Availability & Alarm Monitoring</p>
    </div>
  </div>

  <!-- FILTER PANEL PLACEHOLDER (Dynamic Injected via JS) -->
  <div id="customFilterPanelPlaceholder"></div>

  <!-- 1. KPI SUMMARY CARDS -->
  <div class="custom-kpi-grid">
    <div class="custom-kpi-card" id="customKpiCardTotalAlarms" style="cursor: pointer;" title="Click to filter Active Down Sites Only">
      <div class="custom-kpi-icon-wrapper custom-kpi-icon-danger">
        <span style="font-weight: bold;">ALL</span>
      </div>
      <div class="custom-kpi-content">
        <span class="custom-kpi-title">TOTAL ALARMS DOWN</span>
        <span class="custom-kpi-value" id="statTotalAlarms">0</span>
      </div>
    </div>

    <div class="custom-kpi-card" id="customKpiCardSitesAffected" style="cursor: pointer;" title="Click to filter All Affected Sites">
      <div class="custom-kpi-icon-wrapper custom-kpi-icon-warning">
        <span style="font-weight: bold;">LOC</span>
      </div>
      <div class="custom-kpi-content">
        <span class="custom-kpi-title">SITES AFFECTED</span>
        <span class="custom-kpi-value" id="statSitesAffected" style="color: #f59e0b;">0</span>
      </div>
    </div>

    <div class="custom-kpi-card" id="customKpiCardActiveDown" style="cursor: pointer;" title="Click to filter Currently Down Sites Only">
      <div class="custom-kpi-icon-wrapper custom-kpi-icon-danger">
        <span style="font-weight: bold;">NOW</span>
      </div>
      <div class="custom-kpi-content">
        <span class="custom-kpi-title">ACTIVE DOWN SITES</span>
        <span class="custom-kpi-value" id="statActiveDownSites" style="color: #ef4444;">0</span>
      </div>
    </div>

    <div class="custom-kpi-card">
      <div class="custom-kpi-icon-wrapper custom-kpi-icon-success">
        <span style="font-weight: bold;">SLA</span>
      </div>
      <div class="custom-kpi-content">
        <span class="custom-kpi-title">AVG. AVAILABILITY</span>
        <span class="custom-kpi-value" id="statAvgAvail" style="color: #10b981;">100.0%</span>
      </div>
    </div>

    <div class="custom-kpi-card">
      <div class="custom-kpi-icon-wrapper custom-kpi-icon-info">
        <span style="font-weight: bold;">TOP</span>
      </div>
      <div class="custom-kpi-content">
        <span class="custom-kpi-title">MOST AFFECTED SITE</span>
        <span class="custom-kpi-value" id="statMostAffected" style="font-size: 16px; word-break: break-all;">-</span>
        <span id="statMostAffectedDowntime" style="font-size: 12px; color: #a1a1aa; margin-top: 2px; display: block;">-</span>
      </div>
    </div>
  </div>

  <!-- 2. ALARMS DOWN BY SITE TABLE PANEL -->
  <div class="custom-panel-card">
    <div class="custom-panel-body" id="alarmTableContainer">
      <div style="color: #a1a1aa; padding: 24px; text-align: center;">Loading alarm data...</div>
    </div>
  </div>

  <!-- 3. SITE DETAIL DRILLDOWN MODAL -->
  <div id="customSiteDetailModal" class="custom-modal-overlay" style="display: none !important;"></div>
</div>
